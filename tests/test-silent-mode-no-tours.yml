name: Test silent mode with no tours directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake PR event payload
        run: |
          cat > /tmp/pr-event.json << 'EOF'
          {
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "head": { "ref": "feature-branch", "sha": "abc123" },
              "base": { "ref": "main", "sha": "def456" }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": { "login": "test-owner" }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/pr-event.json" >> $GITHUB_ENV
      - name: Run action in silent mode (expect failure on API call with fake token)
        id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          silent: 'true'
          tour-path: '.tours/'
        continue-on-error: true
      - name: Assert action failed (expected - fake token cannot call GitHub API)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake token for API calls"
