name: Test no PR context error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request event context.
      # Under workflow_dispatch (used by act), github.context.payload.pull_request
      # is undefined, so the action should fail with a specific error message.
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context"
