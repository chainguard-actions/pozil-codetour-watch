name: Test custom tour-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts a custom tour-path input.
      # The action will still fail because there is no PR context under
      # workflow_dispatch, but we verify the failure is due to missing PR
      # context (not due to invalid tour-path input parsing).
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          tour-path: '.tours/custom/'
        continue-on-error: true

      - name: Assert action failed due to missing PR context (not tour-path error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context (tour-path input accepted)"
