name: Test custom tour-path input
# The action accepts a custom tour-path input. Even with a valid path,
# the action will fail because there is no PR context under workflow_dispatch.
# This test verifies the action fails (not crashes unexpectedly) and that
# the tour-path input is accepted without input validation errors.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom tours directory with a sample tour file
        run: |
          mkdir -p custom-tours
          cat > custom-tours/sample.tour <<'EOF'
          {
            "title": "Sample Tour",
            "steps": [
              {
                "file": "README.md",
                "description": "Start here",
                "line": 1
              }
            ]
          }
          EOF

      - name: Run action with custom tour-path (expect failure - no PR context)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          tour-path: 'custom-tours/'
          silent: 'true'
        continue-on-error: true

      - name: Assert action failed with expected error (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context (custom tour-path accepted)"
