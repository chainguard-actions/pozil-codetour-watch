name: Test custom tour-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom tour-path (expect failure - no PR context)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          tour-path: '.custom-tours/'
        continue-on-error: true

      - name: Assert action failed with expected error (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context (custom tour-path accepted)"
