name: Test silent mode with custom tour path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: fake-token
          silent: 'true'
          tour-path: '.tours/'
          fail-on-missing-tour-updates: 'false'
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action failed due to missing PR context (not due to bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context (inputs were accepted)"
