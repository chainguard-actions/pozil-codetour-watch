name: Test custom tour-path missing directory error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent custom tour-path (expect failure)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          tour-path: '.non-existent-tours/'
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing custom tour-path, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing custom tour-path"
