name: Test custom tour path that does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake PR event payload
        run: |
          cat > /tmp/pr-event-custom.json << 'EOF'
          {
            "number": 42,
            "pull_request": {
              "number": 42,
              "title": "Test PR with custom tour path",
              "head": { "ref": "feature-branch", "sha": "abc123" },
              "base": { "ref": "main", "sha": "def456" }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": { "login": "test-owner" }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/pr-event-custom.json" >> $GITHUB_ENV
      - name: Run action with custom non-existent tour path (expect failure)
        id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          silent: 'true'
          tour-path: '.custom-tours/'
          fail-on-missing-tour-updates: 'false'
        continue-on-error: true
      - name: Assert action failed (expected - fake token or missing custom tour path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed as expected"
