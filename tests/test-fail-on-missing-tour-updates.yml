name: Test fail-on-missing-tour-updates input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fail-on-missing-tour-updates enabled (expect failure - no PR context)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          fail-on-missing-tour-updates: 'true'
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (fail-on-missing-tour-updates=true, no PR context)"
