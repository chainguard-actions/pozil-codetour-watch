name: Test default tour path missing (graceful skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure default .tours/ directory does not exist
        run: |
          rm -rf .tours/
          echo "Confirmed: .tours/ directory does not exist"
          ls -la | grep tours || echo "No tours directory found (expected)"

      - name: Run action with default tour path (expect failure - no PR context, not missing dir)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'false'
          fail-on-missing-tour-updates: 'false'
        continue-on-error: true

      - name: Assert action failed due to missing PR context (not missing tour dir)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context (missing .tours/ dir handled gracefully before PR check)"
