name: Test fail-on-missing-tour-updates input
# The action accepts a fail-on-missing-tour-updates boolean input.
# Under workflow_dispatch (used by act), there is no PR context, so the
# action will fail with "Couldn't find PR info in current context".
# This test verifies the input is accepted and the action fails gracefully.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fail-on-missing-tour-updates enabled (expect failure - no PR context)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          fail-on-missing-tour-updates: 'true'
        continue-on-error: true

      - name: Assert action failed with expected error (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context (fail-on-missing-tour-updates accepted)"
