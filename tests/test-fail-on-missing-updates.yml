name: Test fail-on-missing-tour-updates input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the fail-on-missing-tour-updates boolean input.
      # The action will fail because there is no PR context under workflow_dispatch,
      # but we verify the failure is due to missing PR context (not input parsing errors).
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          fail-on-missing-tour-updates: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context (fail-on-missing-tour-updates input accepted)"

      # Test with fail-on-missing-tour-updates set to false (default)
      - id: action-no-fail
        uses: .
        with:
          repo-token: ${{ github.token }}
          silent: 'true'
          fail-on-missing-tour-updates: 'false'
        continue-on-error: true

      - name: Assert action also failed due to missing PR context (not the flag)
        env:
          OUTCOME: ${{ steps.action-no-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in PR context (fail-on-missing-tour-updates=false accepted)"
